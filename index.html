<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Un Universo Para Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{touch-action:none;overscroll-behavior:none;height:100%;width:100%}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif}
button{font-family:inherit}

/* INTRO */
#inicio{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2a0a4a 0%,#0c0118 55%,#000 100%);z-index:10;transition:opacity 1.5s ease;padding:20px;overflow:hidden}
#textoTipeo{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.5rem,5.5vw,2.2rem);color:#f5d0ff;text-shadow:0 0 20px #d68bff,0 0 40px #a06bff;text-align:center;min-height:3.4em;max-width:700px;margin-bottom:18px;position:relative;z-index:2}
.cursor-tipeo{display:inline-block;width:2px;background:#f5d0ff;margin-left:3px;animation:parpadeo .8s infinite}
@keyframes parpadeo{0%,50%{opacity:1}51%,100%{opacity:0}}
.nebulosa{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;animation:deriva 14s ease-in-out infinite alternate}
.nebulosa.n1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,#ff9bd6 0%,transparent 65%)}
.nebulosa.n2{width:55vmax;height:55vmax;right:-18vmax;bottom:-20vmax;background:radial-gradient(circle,#a06bff 0%,transparent 65%);animation-delay:-6s}
@keyframes deriva{to{transform:translate(6vmax,4vmax) scale(1.15)}}
#estrellasIntro{position:absolute;inset:0;pointer-events:none}
#estrellasIntro span{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px #ffd9f5;opacity:.15;animation:titilar infinite ease-in-out}
@keyframes titilar{50%{opacity:1}}
.orbital{position:relative;width:120px;height:120px;margin-bottom:34px;z-index:2}
.nucleo{position:absolute;inset:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd0ec 40%,#a06bff);box-shadow:0 0 30px #ff9bd6,0 0 70px #a06bff;animation:latido 2.4s ease-in-out infinite}
.anillo{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,155,214,.45);animation:girar 6s linear infinite}
.anillo.a2{inset:16px;border-color:rgba(160,107,255,.6);animation-duration:9s;animation-direction:reverse}
.anillo i{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #ff9bd6}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes latido{50%{transform:scale(1.18)}}
#cargaIntro{position:relative;z-index:2;width:min(260px,70vw);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;transition:opacity .6s}
#cargaIntro.listo{opacity:0}
#cargaBarra{height:100%;width:0;background:linear-gradient(90deg,#ff9bd6,#d68bff,#a06bff);box-shadow:0 0 12px #d68bff;transition:width .3s}
#botonEntrar{position:relative;z-index:2;margin-top:26px;padding:15px 40px;font-size:1.1em;border:none;border-radius:50px;background:linear-gradient(135deg,#ff9bd6,#a06bff);color:#fff;cursor:pointer;box-shadow:0 0 25px rgba(255,155,214,.7);transition:transform .3s,opacity .6s;opacity:0;pointer-events:none}
#botonEntrar.mostrar{opacity:1;pointer-events:auto;animation:pulso 2.2s ease-in-out infinite}
#botonEntrar:hover{transform:scale(1.08)}
@keyframes pulso{0%,100%{box-shadow:0 0 25px rgba(255,155,214,.6)}50%{box-shadow:0 0 45px rgba(255,155,214,1),0 0 80px rgba(160,107,255,.5)}}
.oculto{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#inicio *{animation:none!important}#estrellasIntro span{opacity:.8}}

/* GALAXIA */
#galaxia{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 2.5s ease}
#galaxia.visible{opacity:1}
#lienzo{position:absolute;inset:0;display:block;touch-action:none}
.estrella-cursor{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 10px 4px #ffd9f5;pointer-events:none;animation:aparecerEstrella 1.2s ease-out forwards;z-index:3}
@keyframes aparecerEstrella{0%{opacity:1;transform:scale(.3)}70%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.6)}}
.mensaje{position:absolute;color:#ffe9fb;font-weight:600;white-space:nowrap;pointer-events:none;animation:subirMensaje 2.5s ease-out forwards;text-shadow:0 0 12px #ff9bd6,0 0 28px rgba(214,139,255,.7);z-index:3}
@keyframes brillarTexto{0%{text-shadow:0 0 10px #ff9bd6,0 0 18px rgba(255,155,214,.6),0 0 28px rgba(160,107,255,.4)}100%{text-shadow:0 0 22px #fff,0 0 40px #ff9bd6,0 0 65px #d68bff,0 0 90px rgba(214,139,255,.6)}}
@keyframes subirMensaje{0%{opacity:0;transform:translateY(10px) scale(.95)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.03)}}
#titulo-galaxia{position:fixed;top:25px;width:100%;text-align:center;color:#f5d0ff;text-shadow:0 0 15px #d68bff,0 0 30px rgba(214,139,255,.5);font-size:1.2em;font-weight:600;z-index:5;pointer-events:none}

/* REPRODUCTOR Y BOTONES */
body:not(.dentro) #reproductor,body:not(.dentro) #botonReiniciar,body:not(.dentro) #botonPreguntas,body.quiz-abierto #botonPreguntas{display:none}
#reproductor{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(94vw,380px);padding:12px 16px 10px;border-radius:24px;background:rgba(18,5,36,.78);border:1px solid rgba(214,139,255,.4);box-shadow:0 0 28px rgba(160,107,255,.35);z-index:999;text-align:center}
#tituloCancion{color:#f5d0ff;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 12px rgba(214,139,255,.7);margin-bottom:8px}
#barra{height:5px;border-radius:5px;background:rgba(255,255,255,.14);cursor:pointer;margin-bottom:10px;overflow:hidden}
#progreso{height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#ff9bd6,#a06bff)}
#controles{display:flex;align-items:center;justify-content:center;gap:18px}
#controles button{border:none;background:none;color:#f5d0ff;font-size:1.5em;cursor:pointer;width:44px;height:44px;border-radius:50%}
#controles #botonMusica{width:54px;height:54px;background:radial-gradient(circle at 35% 30%,rgba(255,155,214,.35),rgba(160,107,255,.15));box-shadow:0 0 20px rgba(214,139,255,.55);transition:transform .25s,box-shadow .25s}
#controles #botonMusica:hover{transform:scale(1.08);box-shadow:0 0 32px rgba(214,139,255,.8)}
#botonMusica .iconoPlay{font-size:1.3em;pointer-events:none}
#botonReiniciar,#botonGiroscopio{position:fixed;bottom:112px;padding:9px 16px;border-radius:50px;background:rgba(160,107,255,.18);border:1px solid rgba(214,139,255,.5);color:#f5d0ff;font-size:.85em;cursor:pointer;z-index:999;box-shadow:0 0 18px rgba(214,139,255,.35)}
#botonReiniciar{left:16px}
#botonGiroscopio{right:16px;display:none}

/* ESTRELLAS SECRETAS Y MODALES */
.estrella-secreta{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;cursor:pointer;z-index:6;display:none;will-change:transform,opacity}
.estrella-secreta i{position:absolute;inset:0;margin:auto;display:block;pointer-events:none}
.estrella-secreta .brillo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,rgba(255,233,168,.85) 0%,rgba(255,182,230,.35) 42%,transparent 70%);animation:brilloEstrella 2.2s ease-in-out infinite}
.estrella-secreta .forma{width:20px;height:20px;background:linear-gradient(135deg,#fffdf0,#ffe29b 55%,#ffb6e6);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:giroEstrella 6s linear infinite}
.estrella-secreta.encontrada .brillo{animation:none;opacity:.3}
.estrella-secreta.encontrada .forma{animation:none;filter:grayscale(.7)}
@keyframes brilloEstrella{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.3);opacity:1}}
@keyframes giroEstrella{to{transform:rotate(360deg)}}

.overlay-modal{position:fixed;inset:0;background:rgba(5,0,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .8s;padding:30px}
.overlay-modal.mostrar{opacity:1;pointer-events:auto}
.overlay-modal h2{color:#ffe9fb;font-size:1.6em;text-shadow:0 0 20px #ff9bd6,0 0 40px #d68bff;margin-bottom:20px;max-width:600px;animation:brillarTexto 1.2s ease-in-out infinite alternate}
.overlay-modal p{color:#e6c9ff;font-size:1.05em;max-width:550px;margin-bottom:20px;line-height:1.5}
.overlay-modal img{max-width:260px;max-height:260px;border-radius:14px;box-shadow:0 0 30px rgba(255,155,214,.5);margin-bottom:20px;display:none}
.overlay-modal img.mostrar-img{display:block}
.overlay-modal button.principal{padding:12px 32px;font-size:1em;border:none;border-radius:50px;background:linear-gradient(135deg,#ff9bd6,#a06bff);color:#fff;cursor:pointer;box-shadow:0 0 25px rgba(255,155,214,.6)}
.opcion-pregunta{padding:12px;border-radius:12px;border:1px solid rgba(214,139,255,.5);background:rgba(160,107,255,.18);color:#f5d0ff;cursor:pointer;font-size:1em;transition:transform .2s,background .2s}
.opcion-pregunta:hover{transform:scale(1.03);background:rgba(160,107,255,.32)}
#opcionesPregunta{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;width:100%;max-width:400px}
#inputPregunta{display:none;padding:12px;border-radius:12px;border:none;width:100%;max-width:400px;margin-bottom:20px;font-size:1em}

/* PREGUNTAS */
[hidden]{display:none!important}
#botonPreguntas{position:fixed;top:84px;left:50%;transform:translateX(-50%);padding:11px 24px;border:none;border-radius:50px;background:linear-gradient(135deg,#ff9bd6,#a06bff);color:#fff;font-size:.95em;cursor:pointer;z-index:999;box-shadow:0 0 22px rgba(255,155,214,.65)}
.cerrar-quiz{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(214,139,255,.5);background:rgba(160,107,255,.18);color:#f5d0ff;font-size:1.1em;cursor:pointer}
#vistaPregunta,#vistaResultado{display:flex;flex-direction:column;align-items:center;width:100%}
#opcionesPregunta.bloqueado{pointer-events:none}
.opcion-pregunta.correcta{background:rgba(120,255,180,.25);border-color:#8fffc0}
.opcion-pregunta.incorrecta{background:rgba(255,120,150,.25);border-color:#ff8fa6}
#retroQuiz{min-height:1.5em}
#estrellasResultado{color:#ffe29b;font-size:2.6em;letter-spacing:.12em;margin-bottom:14px;text-shadow:0 0 18px #ffb6e6}
#estrellasResultado span{display:inline-block;animation:popEstrella .5s both}
@keyframes popEstrella{0%{transform:scale(0);opacity:0}70%{transform:scale(1.4)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div id="inicio">
  <div class="nebulosa n1"></div>
  <div class="nebulosa n2"></div>
  <div id="estrellasIntro"></div>
  <div class="orbital"><div class="anillo a1"><i></i></div><div class="anillo a2"><i></i></div><div class="nucleo"></div></div>
  <div id="textoTipeo"></div>
  <div id="cargaIntro"><div id="cargaBarra"></div></div>
  <button id="botonEntrar">Entrar al universo 💫</button>
</div>

<div id="galaxia">
  <canvas id="lienzo"></canvas>
  <p id="titulo-galaxia">Toca para revelar mensajes · desliza para girar 💜</p>
</div>

<div id="reproductor">
  <div id="tituloCancion"></div>
  <div id="barra"><div id="progreso"></div></div>
  <div id="controles">
    <button id="btnAnterior" aria-label="Canción anterior">⏮</button>
    <button id="botonMusica" aria-label="Reproducir o pausar"><span class="iconoPlay" id="iconoPlay">▶️</span></button>
    <button id="btnSiguiente" aria-label="Siguiente canción">⏭</button>
  </div>
</div>
<button id="botonReiniciar" aria-label="Reiniciar experiencia">Reiniciar ✨</button>
<button id="botonGiroscopio" aria-label="Activar giroscopio">Activar giroscopio 🌀</button>
<button id="botonPreguntas">Preguntas 💌</button>
<div id="contenedorEstrellas"></div>

<div id="modalSecreto" class="overlay-modal">
  <h2>Encontraste una estrella escondida ✨</h2>
  <p id="mensajeSecreto"></p>
  <img id="fotoSecreta" src="" alt="Foto especial">
  <button class="principal" id="cerrarSecreto">Cerrar</button>
</div>

<div id="modalPregunta" class="overlay-modal">
  <button class="cerrar-quiz" id="cerrarQuiz" aria-label="Cerrar preguntas">✕</button>
  <div id="vistaPregunta">
    <p id="progresoQuiz"></p>
    <h2 id="textoPregunta"></h2>
    <div id="opcionesPregunta"></div>
    <input type="text" id="inputPregunta" placeholder="Escribe tu respuesta...">
    <button class="principal" id="botonEnviarPregunta">Enviar respuesta 💌</button>
    <p id="retroQuiz"></p>
  </div>
  <div id="vistaResultado" hidden>
    <h2>¡Terminaste, Ake! 💜</h2>
    <div id="estrellasResultado"></div>
    <p id="puntosResultado"></p>
    <p id="mensajeResultado"></p>
    <button class="principal" id="botonVolverQuiz">Volver al universo 💫</button>
  </div>
</div>

<div id="modalFinal" class="overlay-modal">
  <h2>Este es solo un pedacito de lo que siento por ti, Ake 💜</h2>
  <p>Gracias por llegar hasta aquí. Cada estrella de esta galaxia tiene un poquito de cariño para ti.</p>
  <img id="fotoFinal" src="" alt="Foto especial">
  <button class="principal" id="botonReiniciarFinal">Volver a empezar 💫</button>
</div>

<audio id="audioCancion" preload="none"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const REPO_BASE = 'https://cdn.jsdelivr.net/gh/diegoenriquecastroarroyo-ux/universo@main/';
const ES_MOVIL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 820;
const FOTO_UNICA = 'foto1.jpg';
const vibrarSuave = () => navigator.vibrate && navigator.vibrate(35);
const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bolsaDe = fuente => { let b = []; return () => { if (!b.length) b = barajar([...fuente]); return b.pop(); }; };

/* ---------- FIREBASE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDreFm4ZvheLrpQ_CzBkEB4r6mmH7a7uF4",
  authDomain: "universoparaake.firebaseapp.com",
  projectId: "universoparaake",
  storageBucket: "universoparaake.firebasestorage.app",
  messagingSenderId: "568688269379",
  appId: "1:568688269379:web:12f8631a5dac2427c65cf6"
};
let db = null;
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
catch (e) { console.warn('Firebase no configurado todavía:', e); }

function guardarRespuesta(p, respuesta, correcta, puntos) {
  if (!db) return;
  db.collection('respuestas').add({
    preguntaId: p.id, pregunta: p.texto, tipo: p.tipo, respuesta, correcta, puntos,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => console.error('Error guardando respuesta:', err));
}

/* ---------- PREGUNTAS ----------
   cerrada = botones, abierta = texto libre.
   respuestaCorrecta: null = no se califica (dan 2 pts por responder); 'EDITA_AQUI' = aún sin definir;
   cualquier otro texto = se compara para saber si acertó. */
const cerrada = (id, texto, opciones, r = 'EDITA_AQUI') => ({ id, tipo: 'cerrada', texto, opciones, respuestaCorrecta: r });
const abierta = (id, texto, r = null) => ({ id, tipo: 'abierta', texto, respuestaCorrecta: r });
const PREGUNTAS = [
  cerrada(1, '¿En qué mes nos conocimos?', ['Enero', 'Marzo', 'Julio', 'Octubre'], 'Marzo'),
  cerrada(2, '¿Dónde fue nuestra primera cita?', ['El parque', 'El cine', 'El mercado', 'Una cafetería'], 'mercado'),
  cerrada(3, '¿Verdadero o falso: la primera vez que hablamos fue por redes sociales?', ['Verdadero', 'Falso'], 'Falso'),
  cerrada(4, '¿Cuál es mi comida favorita?', ['Pizza', 'Enchiladas', 'Tacos', 'Hamburguesas'], 'Enchiladas'),
  cerrada(5, '¿Qué película vimos juntos esa vez?', ['Miraculous', 'Frozen', 'Coco', 'Barbie'], 'Miraculous'),
  cerrada(6, '¿En qué estación del año nos conocimos?', ['Primavera', 'Verano', 'Otoño', 'Invierno'], 'Primavera'),
  cerrada(7, '¿Cuál era el apodo con el que más te decía?', ['Princesa', 'Bebé', 'Cachetona', 'Mi vida'], 'Cachetona'),
  cerrada(8, '¿Verdadero o falso: te puse nervioso(a) la primera vez que nos vimos?', ['Verdadero', 'Falso'], null),
  cerrada(9, '¿Qué canción nos recuerda a los dos?', ['Despacito', 'Lo tienes todo', 'Tusa', 'Bailando'], 'Lo tienes todo'),
  cerrada(10, '¿Cuál fue el primer regalo que te di?', ['Un oso de peluche', 'Unas flores', 'Un llavero', 'Un Stitch'], 'Stitch'),
  abierta(11, '¿Cómo fue nuestro primer beso? Cuéntamelo con tus palabras'),
  abierta(12, '¿Cómo nos conocimos, según tú?', 'EDITA_AQUI'),
  abierta(13, '¿Cuál dirías que fue nuestro momento más bonito juntos?'),
  abierta(14, '¿Qué es lo primero que pensaste de mí cuando me conociste?'),
  abierta(15, '¿Cuál fue nuestra primera pelea o malentendido?'),
  abierta(16, '¿Qué es lo que más extrañas de nosotros?'),
  abierta(17, '¿Cuál fue el mejor viaje o salida que tuvimos?', 'EDITA_AQUI'),
  abierta(18, '¿Qué canción cantábamos juntos?', 'EDITA_AQUI'),
  abierta(19, '¿Qué es lo que más te gustaba hacer conmigo?'),
  abierta(20, 'Si pudieras revivir un solo día de todos los que pasamos juntos, ¿cuál sería?')
];
const PUNTOS_ACIERTO = 10, PUNTOS_PARTICIPACION = 2;
const esCalificable = p => p.tipo === 'cerrada' && p.respuestaCorrecta && p.respuestaCorrecta !== 'EDITA_AQUI';
const TOTAL_CALIFICADAS = PREGUNTAS.filter(esCalificable).length;
const PUNTOS_MAX = TOTAL_CALIFICADAS * PUNTOS_ACIERTO + (PREGUNTAS.length - TOTAL_CALIFICADAS) * PUNTOS_PARTICIPACION;
const MENSAJES_RESULTADO = [
  '',
  'Tenemos que repasar nuestra historia juntos 💕',
  'Uy... creo que me debes varios castigos 😏',
  'Nada mal, aunque algunos detalles se te escaparon 😏',
  'Casi perfecto, se nota que guardas nuestros momentos 💫',
  'Te acuerdas de todo, Ake. Eres increíble 💜'
];
const RETRO_ACIERTO = [
  '¡Exacto! Te acuerdas de todo 💜', '¡Esa era! Sabía que lo sabías ✨', 'Correcto, mi memoria favorita eres tú 💫',
  '¡Bingo! Cada día me sorprendes más 💕', 'Perfecto, cero dudas contigo 🌟', '¡Sí! Esa respuesta merece una estrellita ⭐'
];
const RETRO_FALLO = [
  'Uy, esa no era... me debes un castigo 😏', 'Nooo, casi... pero te perdono con un beso 😘', 'Esa no era, ¡pero sigues siendo mi favorita! 💜',
  'Mmm... creo que alguien necesita repasar nuestra historia 🙈', 'Fallaste, pero tu sonrisa compensa todo ✨', 'Ay, Ake... esa me dolió un poquito 😅💕'
];
const RETRO_NEUTRA = [
  'Gracias por contarme eso 💫', 'Me encantó leerte 💜', 'Guardo tu respuesta en mi estrella favorita ✨',
  'Qué bonito lo que escribes, de verdad 💕', 'Me hiciste sonreír con eso 🥰', 'Cada palabra tuya brilla más que una estrella 🌟'
];
const ultimoElegido = new Map();
function elegir(lista) {
  let i;
  do { i = Math.random() * lista.length | 0; } while (i === ultimoElegido.get(lista) && lista.length > 1);
  ultimoElegido.set(lista, i);
  return lista[i];
}
let quiz;

function reiniciarQuiz() {
  quiz = { i: 0, puntos: 0, aciertos: 0, terminado: false, bloqueado: false };
  $('modalPregunta').classList.remove('mostrar');
  document.body.classList.remove('quiz-abierto');
}
reiniciarQuiz();

function abrirQuiz() {
  $('modalPregunta').classList.add('mostrar');
  document.body.classList.add('quiz-abierto');
  quiz.terminado ? mostrarResultado() : mostrarPregunta();
}
function cerrarQuiz() {
  $('modalPregunta').classList.remove('mostrar');
  document.body.classList.remove('quiz-abierto');
}

function mostrarPregunta() {
  const p = PREGUNTAS[quiz.i];
  $('vistaPregunta').hidden = false;
  $('vistaResultado').hidden = true;

function responder(respuesta, btn) {
  if (quiz.bloqueado) return;
  const q = quiz, p = PREGUNTAS[q.i];
  let correcta = null, puntos = PUNTOS_PARTICIPACION;

const gauss = d => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * d; };
const posEsfera = (r0, r1) => {
  const r = r0 + Math.random() * (r1 - r0), th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
  return [r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)];
};
const ES = 260, NB = 4, B = 0.28;

const anguloBrazo = (i, t, grosor) => (i % NB / NB) * Math.PI * 2 + Math.log(1 + t * 8) / B + gauss(grosor);

function crearGlow() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const c = cv.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.4, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
function puntos(pos, col, size, op, tex) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  if (col) g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeBoundingSphere();
  return new THREE.Points(g, new THREE.PointsMaterial({ size, map: tex, color: 0xffffff, vertexColors: !!col, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: op }));
}
function sprite(tex, color, op, sx, sy) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: op }));
  s.scale.set(sx, sy, 1);
  return s;
}
function campo(tex, n, r0, r1, tam, op) {
  const p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    p.set(posEsfera(r0, r1), i * 3);
    const r = Math.random();
    c.set(r < .12 ? [1, .84, .65] : r < .26 ? [.72, .8, 1] : r < .36 ? [1, .72, .88] : r < .44 ? [.8, .68, 1] : [1, 1, 1], i * 3);
  }
  return puntos(p, c, tam, op, tex);
}

let escena, camara, renderizador, grupoGalaxia, campoEstrellas, campoLejano, lejanas, galaxiasLej, estrellasBrillantes;

function manejarOrientacion(e) {
  if (e.beta === null || e.gamma === null) return;
  if (!giroBase) giroBase = { beta: e.beta, gamma: e.gamma };
  anguloObjetivo = .7 - (e.gamma - giroBase.gamma) * .02;
  elevacionObjetivo = Math.max(.12, Math.min(.9, .5 + (e.beta - giroBase.beta) * .012));

function lanzarMeteoro3D() {
  const rs = ES * (1.6 + Math.random() * .9), as = Math.random() * Math.PI * 2;
  const ini = new THREE.Vector3(Math.cos(as) * rs, ES * (.6 + Math.random() * .9), Math.sin(as) * rs);
  const dir = new THREE.Vector3(-ini.x, -Math.abs(gauss(ES * .3)) - ES * .2, -ini.z).normalize();
  const color = [0xffffff, 0xffe3f4, 0xd9c8ff, 0xc8e8ff][Math.random() * 4 | 0];
  const geo = new THREE.BufferGeometry().setFromPoints([ini.clone(), ini.clone()]);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
  const linea = new THREE.Line(geo, mat);
  escena.add(linea);
  meteoros3D.push({ linea, geo, mat, pos: ini.clone(), dir, vel: ES * (.035 + Math.random() * .025), vida: 1, largo: ES * .22 });
}

const _cola = new THREE.Vector3();
function actualizarMeteoros3D() {
  for (let i = meteoros3D.length - 1; i >= 0; i--) {
    const m = meteoros3D[i];
    m.pos.addScaledVector(m.dir, m.vel);
    m.vida -= .013;
    const cola = _cola.copy(m.pos).addScaledVector(m.dir, -m.largo), p = m.geo.attributes.position;
    p.setXYZ(0, m.pos.x, m.pos.y, m.pos.z); p.setXYZ(1, cola.x, cola.y, cola.z); p.needsUpdate = true;
    m.mat.opacity = Math.max(m.vida, 0);
    if (m.vida <= 0) { escena.remove(m.linea); m.geo.dispose(); m.mat.dispose(); meteoros3D.splice(i, 1); }
  }
}

const modales = ['modalFinal', 'modalSecreto', 'modalPregunta'].map($);

// Calidad adaptativa: solo baja la resolución si el equipo va por debajo de ~45 fps, y nunca por debajo de 1x.
function ajustarResolucion(ahora) {
  if (tiempo3D < 120) { ultimoT = ahora; return; } // calentamiento inicial
  const dt = ahora - ultimoT; ultimoT = ahora;
  if (dt > 250) return;
  acumMs += dt; cuadros++;
  if (cuadros < 90) return;
  const fps = 1000 / (acumMs / cuadros);
  acumMs = 0; cuadros = 0;
  if (fps < 45 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .25); renderizador.setPixelRatio(pixelRatio); }
}

function animar3D(ahora = performance.now()) {
  requestAnimationFrame(animar3D);
  if (modales.some(m => m.classList.contains('mostrar'))) {
    ultimoT = ahora;
    if (++saltos & 1) return; // con un modal encima la galaxia se dibuja a la mitad de cuadros
  } else ajustarResolucion(ahora);
  tiempo3D++;
  grupoGalaxia.rotation.y += .0009;
  estrellasBrillantes.material.opacity = .55 + Math.sin(tiempo3D * .02) * .3;
  nebulosas.forEach(n => { n.material.opacity = .4 + Math.sin(tiempo3D * .02 + n.userData.fase) * .25; });
  lejanas.rotation.y += .00004;
  lejanas.children.forEach(n => { n.material.opacity = n.userData.base + Math.sin(tiempo3D * .008 + n.userData.fase) * .05; });
  galaxiasLej.children.forEach(g => { g.rotation.z += g.userData.vel; });
  galaxiasLej.rotation.y += .00003;
  campoEstrellas.rotation.y += .00006;
  campoLejano.rotation.y += .00002;
  actualizarMeteoros3D();
  anguloCamara += (anguloObjetivo - anguloCamara) * .05;
  elevacionCamara += (elevacionObjetivo - elevacionCamara) * .05;
  const el = Math.max(.12, Math.min(.9, elevacionCamara));
  camara.position.set(Math.sin(anguloCamara) * distanciaCamara * Math.cos(el), Math.sin(el) * distanciaCamara, Math.cos(anguloCamara) * distanciaCamara * Math.cos(el));
  camara.lookAt(0, 0, 0);
  actualizarEstrellasSecretas();
  renderizador.render(escena, camara);
}

  $('modalFinal').classList.add('mostrar');
}
function reiniciarExperiencia() {
  ['modalFinal', 'modalSecreto', 'modalPregunta'].forEach(id => $(id).classList.remove('mostrar'));
  reiniciarQuiz(); contadorToques = 0; finalMostrado = false;
  estrellasSecretas.forEach(e => { e.encontrada = false; e.el.classList.remove('encontrada'); });
  poolMensajes.concat(poolEstrellas).forEach(el => { el.style.display = 'none'; });
}
$('botonReiniciarFinal').addEventListener('click', reiniciarExperiencia);
$('botonReiniciar').addEventListener('click', reiniciarExperiencia);

function generarMensajeEnPunto(x, y) {
  if (!galaxia.classList.contains('visible')) return;
  if (['modalFinal', 'modalSecreto', 'modalPregunta'].some(id => $(id).classList.contains('mostrar'))) return;
  const ahora = Date.now();
  if (ahora - ultimoTiempoMensaje < (ES_MOVIL ? 220 : 160)) return;
  ultimoTiempoMensaje = ahora;
  const e = poolEstrellas[iE]; iE = (iE + 1) % poolEstrellas.length;
  e.style.display = 'block'; e.style.left = x + 'px'; e.style.top = y + 'px';
  reiniciarAnimacion(e);
  flotarMensaje(siguienteMensaje(), x + 15, y - 10);
  if (Math.random() < .2) vibrarSuave();
  revisarFinal();
}

/* ---------- ESTRELLAS SECRETAS ----------
   Viven dentro de la galaxia: orbitan, giran con ella y se desvanecen a ratos, así que hay que cazarlas. */
const estrellasEspeciales = [
  { radio: .55, vel: .0016, bob: .021, mensaje: "Ake, esta es la primera estrella que escondí para ti, la más brillante de toda la galaxia. Ojalá pudieras ver lo mucho que significas para mí 💜" },
  { radio: .82, vel: -.0022, bob: .015, mensaje: "Esta es la segunda estrella secreta. La escondí pensando en cada momento bonito que hemos vivido juntos 💫" },
  { radio: .32, vel: .0027, bob: .027, mensaje: "Y esta es la tercera y última estrella escondida en este universo. Gracias por encontrarlas todas, tal como encontraste un lugar en mi corazón ✨" }
];
const fotoSecreta = $('fotoSecreta');
const estrellasSecretas = estrellasEspeciales.map(d => {
  const e = { ...d, radio: d.radio * ES, ang: Math.random() * 6.28, fase: Math.random() * 6.28, encontrada: false, el: document.createElement('div') };
  e.el.className = 'estrella-secreta';
  e.el.innerHTML = '<i class="brillo"></i><i class="forma"></i>';
  e.el.addEventListener('click', ev => { ev.stopPropagation(); abrirEstrellaSecreta(e); });
  $('contenedorEstrellas').appendChild(e.el);
  return e;
});
const mostrarEstrellasSecretas = () => estrellasSecretas.forEach(e => { e.el.style.display = 'block'; });

const _v = new THREE.Vector3();
function actualizarEstrellasSecretas() {
  camara.updateMatrixWorld();
  grupoGalaxia.updateMatrixWorld();
  for (const e of estrellasSecretas) {
    e.ang += e.vel;
    _v.set(Math.cos(e.ang) * e.radio, Math.sin(tiempo3D * e.bob + e.fase) * ES * .07, Math.sin(e.ang) * e.radio);
    grupoGalaxia.localToWorld(_v);
    _v.project(camara);
    e.el.style.transform = `translate3d(${(_v.x * .5 + .5) * W}px,${(.5 - _v.y * .5) * H}px,0)`;
    e.el.style.opacity = e.encontrada ? .45 : .3 + .7 * Math.max(0, Math.sin(tiempo3D * .012 + e.fase));
  }
}

function abrirEstrellaSecreta(estrella) {
  estrella.encontrada = true;
  estrella.el.classList.add('encontrada');
  $('mensajeSecreto').textContent = estrella.mensaje;
  fotoSecreta.classList.remove('mostrar-img');
  fotoSecreta.onload = () => fotoSecreta.classList.add('mostrar-img');
  fotoSecreta.onerror = () => fotoSecreta.classList.remove('mostrar-img');
  fotoSecreta.src = REPO_BASE + (estrella.foto || FOTO_UNICA);
  $('modalSecreto').classList.add('mostrar');
  vibrarSuave();
}
$('cerrarSecreto').addEventListener('click', () => $('modalSecreto').classList.remove('mostrar'));

/* ---------- REPRODUCTOR ---------- */
const CANCIONES = [
  { titulo: 'Acaríciame',     artista: '',                              archivo: 'ACARICIAME.mp3' },
  { titulo: 'Lo Tienes Todo', artista: 'Julión Álvarez',                archivo: '2.mp3' },
  { titulo: 'Eres Mi Todo',   artista: '',                              archivo: '3.mp3' },
  { titulo: 'Eres tú',        artista: 'Peint',                         archivo: '4.mp3' },
  { titulo: 'Adueñarme',      artista: 'Black Power · Nivel Codiciado', archivo: '5.mp3' },
  { titulo: '365',            artista: 'Los Reales Del Río',            archivo: '6.mp3' }
];
const audio = $('audioCancion'), iconoPlay = $('iconoPlay'), botonMusica = $('botonMusica');
const barra = $('barra'), progreso = $('progreso');
let indice = 0, reproduciendo = false, fadeInterval = null, erroresSeguidos = 0;
const VOLUMEN_MAX = 1;

function limpiarFade() { if (fadeInterval) { clearInterval(fadeInterval); fadeInterval = null; } }

function fadeInAudio() {
  limpiarFade();
  audio.volume = 0;
  audio.play().catch(err => console.error('No se pudo reproducir el audio:', err));
  iconoPlay.textContent = '⏸️';
  reproduciendo = true;
  fadeInterval = setInterval(() => {
    audio.volume = Math.min(VOLUMEN_MAX, audio.volume + .05);
    if (audio.volume >= VOLUMEN_MAX) limpiarFade();
  }, 100);
}
function fadeOutAudio() {
  limpiarFade();
  fadeInterval = setInterval(() => {
    audio.volume = Math.max(0, audio.volume - .05);
    if (audio.volume <= 0) { audio.pause(); limpiarFade(); }
  }, 100);
  iconoPlay.textContent = '▶️';
  reproduciendo = false;
}
function cargar(i, autoplay) {
  indice = (i + CANCIONES.length) % CANCIONES.length;
  const c = CANCIONES[indice];
  audio.src = REPO_BASE + c.archivo;
  $('tituloCancion').textContent = c.artista ? c.titulo + ' · ' + c.artista : c.titulo;
  progreso.style.transform = 'scaleX(0)';
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: c.titulo, artist: c.artista || 'Un Universo Para Ti' });
  if (autoplay) fadeInAudio();
}

audio.addEventListener('ended', () => cargar(indice + 1, true));
audio.addEventListener('playing', () => { erroresSeguidos = 0; });
audio.addEventListener('error', () => { if (++erroresSeguidos < CANCIONES.length) cargar(indice + 1, true); });
audio.addEventListener('timeupdate', () => { if (audio.duration) progreso.style.transform = 'scaleX(' + (audio.currentTime / audio.duration) + ')'; });
barra.addEventListener('click', e => {
  const r = barra.getBoundingClientRect();
  if (audio.duration) audio.currentTime = audio.duration * ((e.clientX - r.left) / r.width);
});
botonMusica.addEventListener('click', () => { reproduciendo ? fadeOutAudio() : fadeInAudio(); });
$('btnAnterior').addEventListener('click', () => cargar(indice - 1, true));
$('btnSiguiente').addEventListener('click', () => cargar(indice + 1, true));
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('previoustrack', () => cargar(indice - 1, true));
  navigator.mediaSession.setActionHandler('nexttrack', () => cargar(indice + 1, true));
}
cargar(0, false);
</script>
